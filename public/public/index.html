<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMEEN AI</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">
    <header>
        <h1>AMEEN</h1>
        <p>Your Personal AI Assistant</p>
    </header>

    <section id="chat">
        <div class="bubble assistant">
            <b>Ameen</b>
            <p>Hello! I'm Ameen. How can I help you?</p>
        </div>
    </section>

    <div class="controls">
        <input id="message" placeholder="Talk to Ameen...">
        <button id="send">Send</button>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
